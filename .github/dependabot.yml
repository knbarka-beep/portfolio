# Dependabot checks the npm packages once a week and opens a pull request when one has an update.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # react and react-dom must have the same version, or npm install fails. Update them in one pull request.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react*"
